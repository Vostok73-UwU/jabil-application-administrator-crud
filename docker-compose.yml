version: '3.8'

services:
  # ============================================================
  # SQL Server 2022 - Base de datos
  # ============================================================
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: jabil-db
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: JabilTest2024!
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - db_data:/var/opt/mssql
      - ./Database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"JabilTest2024!\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - jabil-network
    restart: unless-stopped

  # ============================================================
  # Backend API - ASP.NET Core 10
  # ============================================================
  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: jabil-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=db;Database=JabilTestDB;User=sa;Password=JabilTest2024!;TrustServerCertificate=True;"
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jabil-network
    restart: unless-stopped

  # ============================================================
  # Frontend - Angular 22 (Nginx para producción, Node para dev)
  # ============================================================
  web:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      target: development  # Cambiar a 'production' para build final
    container_name: jabil-web
    environment:
      NODE_ENV: development
    ports:
      - "4200:4200"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - jabil-network
    command: npm run start -- --host 0.0.0.0 --port 4200 --poll 2000

# ============================================================
# Redes y Volúmenes
# ============================================================
networks:
  jabil-network:
    driver: bridge

volumes:
  db_data:
    driver: local